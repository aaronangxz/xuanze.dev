<svg xmlns="http://www.w3.org/2000/svg" class="mk mk-life" viewBox="0 0 64 64" fill="none" stroke="#2A2E35" stroke-linecap="round" stroke-linejoin="round" ><style> /* Day/night: --d is 1 in light mode, 0 in dark; everything below derives from it and cross-fades on toggle. */ .mk { --d: 1; --wall: #F4EADB; --floor: #E2CBA8; --frame: #FFFFFF; --winsky: #A8DBF6; --sky: #A9DCF5; --hill: #9ED39B; --canopy: #5DB16E; --track: #E3876B; --lane: #FFF4E6; --cloud: #FFFFFF; } .mk .wall { fill: var(--wall); } .mk .floor { fill: var(--floor); } .mk .frame { fill: var(--frame); } .mk .bars { stroke: var(--frame); } .mk .winsky { fill: var(--winsky); } .mk .sky { fill: var(--sky); } .mk .hill { fill: var(--hill); } .mk .canopy { fill: var(--canopy); } .mk .track { fill: var(--track); } .mk .lane { stroke: var(--lane); } .mk .cloud { fill: var(--cloud); }  .mk .day { opacity: var(--d);  } .mk .night { opacity: calc(1 - var(--d));  } .mk .beam { opacity: calc((1 - var(--d)) * .9); } .mk .postglow { opacity: calc((1 - var(--d)) * .55); } .mk .sunset { opacity: var(--d); transform: translateY(calc((1 - var(--d)) * 16px));  } .mk .moonrise { opacity: calc(1 - var(--d)); transform: translateY(calc(var(--d) * 16px));  } .mk .shadow { opacity: .16; } .mk g, .mk path, .mk circle, .mk rect { transform-box: view-box; transform-origin: 0 0; } /* resting poses */ .mk-work .fig { transform: translate(20px, 44px); } .mk-work .th { transform: rotate(-90deg); } .mk-work .sh { transform: rotate(90deg); } .mk-work .ua { transform: rotate(-72deg); } .mk-work .fa { transform: rotate(-14deg); } .mk-work .lid { transform: rotate(104deg); } .mk-work .spark { transform: scale(0); } .mk-life .up { transform: rotate(12deg); } .mk-life .th.f { transform: rotate(-52deg); } .mk-life .sh.f { transform: rotate(38deg); } .mk-life .th.b { transform: rotate(34deg); } .mk-life .sh.b { transform: rotate(82deg); } .mk-life .ua.f { transform: rotate(38deg); } .mk-life .fa.f { transform: rotate(-95deg); } .mk-life .ua.b 